# Type Path                      Mode User           Group           Age
# Intake socket directory: only aao-supervisor writes it (precondition 2); setgid so the
# socket inherits group aao-auditor, which is the only group allowed to connect.
d     /run/aao-veto-intake       2750 aao-supervisor aao-auditor     -
# Signed heartbeat: written only by aao-supervisor, readable by aao-ledger-read
# (integrator, supervisor) and by the auditor unit (primary gid aao-ledger-read).
d     /var/lib/aao-heartbeat     2750 aao-supervisor aao-ledger-read -
d     /var/lib/aao-supervisor/keys 0700 aao-supervisor aao-supervisor -
d     /var/lib/aao-auditor/inbox   0750 aao-auditor  aao-auditor     -
d     /var/lib/aao-auditor/reports 0750 aao-auditor  aao-ledger-read -
