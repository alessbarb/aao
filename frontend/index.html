<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151c">
  <title>AAO Control Center</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color-scheme:dark;background:#10151c;color:#e9eef6;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}.shell{max-width:1440px;margin:auto;padding:24px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid #293442;padding-bottom:18px}
    .brand{display:flex;align-items:center;gap:12px}.mark{width:38px;height:38px;border-radius:10px;background:#183d37;color:#83e0c2;display:grid;place-items:center;font-weight:800}
    h1{font-size:1.2rem;margin:0;letter-spacing:.01em}h2{font-size:1.05rem;margin:0 0 14px}h3{font-size:.95rem;margin:0 0 8px}p{line-height:1.5;color:#aeb9c9;margin:.45rem 0}
    .top-actions{display:flex;align-items:center;gap:10px}button,select{font:inherit;color:#e9eef6;background:#202b38;border:1px solid #3a495b;border-radius:7px;padding:9px 12px}button{cursor:pointer}button:hover{background:#2a3848}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #8ec5ff;outline-offset:2px}
    .layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:26px;padding-top:24px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{text-align:left;background:transparent;border-color:transparent;color:#aeb9c9}.nav button[aria-current="page"]{background:#1c2a35;border-color:#2f4a50;color:#9ae2c8}
    main{min-width:0}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}.eyebrow,.muted,.meta{font-size:.82rem;color:#9aa9ba}.eyebrow{letter-spacing:.08em;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.panel,.metric,.task-card{background:#171f29;border:1px solid #2a3745;border-radius:9px;padding:16px}.metric strong{display:block;font-size:1.4rem;margin-top:6px}.panel{margin-bottom:14px}.panel p:last-child{margin-bottom:0}.banner{border-left:3px solid #d7a64a;background:#292519;padding:12px 14px;color:#ecd8a8;margin:14px 0 20px;font-size:.9rem}.state{display:inline-block;border:1px solid #42546a;border-radius:99px;padding:3px 8px;font-size:.75rem;color:#c6d5e5}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.lane{background:#141b24;border:1px solid #273341;border-radius:9px;padding:12px;min-height:120px}.lane h3{color:#cbd6e3}.task-card{padding:12px;margin-top:9px}.task-title{color:#e9eef6;background:none;border:0;padding:0;text-align:left;font-weight:650}.list{list-style:none;margin:0;padding:0}.list li{border-top:1px solid #2a3745;padding:12px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:start}.error{color:#ffb4b4}.empty{padding:28px 16px;text-align:center;border:1px dashed #3a495b;border-radius:9px;color:#aeb9c9}.refs{font-family:ui-monospace,monospace;font-size:.8rem;overflow-wrap:anywhere;color:#c2d4e7}.decision{border-left:3px solid #8b6c35;padding-left:12px}.hidden{display:none!important}
    @media(max-width:800px){.shell{padding:16px}.layout{grid-template-columns:1fr;gap:16px}.nav{flex-direction:row;overflow-x:auto;padding-bottom:5px}.nav button{white-space:nowrap}.grid,.board{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.topbar,.page-head{align-items:flex-start;flex-direction:column}.top-actions{width:100%}.top-actions select{min-width:0;flex:1}.grid,.board{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><div class="mark" aria-hidden="true">A</div><div><h1>AAO Control Center</h1><span class="muted">Operaciones organizativas · desarrollo local</span></div></div>
      <div class="top-actions"><label class="hidden" for="project">Proyecto</label><select id="project" aria-label="Proyecto"></select><button id="reload" type="button">Actualizar</button></div>
    </header>
    <div id="message" role="status" aria-live="polite" class="muted">Conectando con el núcleo local…</div>
    <div class="layout">
      <nav class="nav" aria-label="Navegación principal">
        <button type="button" data-page="home" aria-current="page">Inicio</button>
        <button type="button" data-page="project">Proyecto</button>
        <button type="button" data-page="activity">Actividad</button>
        <button type="button" data-page="evidence">Evidencias</button>
        <button type="button" data-page="decisions">Decisiones reservadas</button>
      </nav>
      <main id="content" tabindex="-1"></main>
    </div>
  </div>
  <script>
    "use strict";
    const states=["INBOX","READY","IN_PROGRESS","IN_REVIEW","VERIFIED","DONE"];
    const labels={INBOX:"Entrada",READY:"Preparado",IN_PROGRESS:"En curso",IN_REVIEW:"En revisión",VERIFIED:"Verificado",DONE:"Completado"};
    const projectSelect=document.querySelector("#project"),content=document.querySelector("#content"),message=document.querySelector("#message");
    let projects=[],selectedProject=null,board=[],detail=null,activity=[],selectedTask=null,activePage="home",ceoToken=null;
    function el(tag,text,cls){const item=document.createElement(tag);if(text!==undefined)item.textContent=text;if(cls)item.className=cls;return item}
    function panel(title){const p=el("section",undefined,"panel");p.append(el("h2",title));return p}
    function empty(text){return el("div",text,"empty")}
    function displayDate(value){if(!value)return "Fecha no disponible";const d=new Date(value);return Number.isNaN(d.getTime())?String(value):d.toLocaleString("es-ES")}
    async function request(path){
      const headers=ceoToken?{"X-CEO-Token":ceoToken}:{};
      let response=await fetch(path,{credentials:"same-origin",headers});
      if(response.status===403&&!ceoToken){
        const token=window.prompt("Token CEO de desarrollo para consultar PostgreSQL (permanece solo en esta pestaña):");
        if(!token)throw new Error("Acceso no autorizado. No se ha guardado ninguna credencial.");
        ceoToken=token;response=await fetch(path,{credentials:"same-origin",headers:{"X-CEO-Token":ceoToken}});
      }
      if(!response.ok)throw new Error("La API respondió HTTP "+response.status);
      return response.json();
    }
    function setMessage(text,isError=false){message.replaceChildren(el("p",text,isError?"error":"muted"));}
    async function loadProjects(){
      setMessage("Consultando proyectos autorizados…");
      projects=await request("/v1/projects");
      projectSelect.replaceChildren();
      for(const p of projects){const option=el("option",p.name+" · "+p.state);option.value=p.id;projectSelect.append(option)}
      if(projects.length===0){selectedProject=null;board=[];detail=null;activity=[];render();return}
      selectedProject=projects.some(p=>p.id===selectedProject)?selectedProject:projects[0].id;
      projectSelect.value=selectedProject;
      await loadProjectData();
    }
    async function loadProjectData(){
      if(!selectedProject){render();return}
      setMessage("Actualizando estado real del proyecto…");
      const base="/v1/projects/"+encodeURIComponent(selectedProject);
      try{
        [detail,board,activity]=await Promise.all([request(base),request(base+"/board"),request(base+"/activity")]);
        if(selectedTask&&!board.some(w=>w.id===selectedTask))selectedTask=null;
        render();setMessage("Datos leídos de PostgreSQL. Los estados mostrados no certifican revisión ni evidencia.");
      }catch(error){setMessage("No se pudo cargar el proyecto: "+error.message,true);content.replaceChildren(el("div","La información no está disponible; no se muestran datos de ejemplo.","empty"))}
    }
    function renderHome(){
      const head=el("div",undefined,"page-head");head.append(el("div",undefined,"eyebrow"));head.lastChild.textContent="Perspectiva organizativa y técnica";
      const title=el("h2",projects.length?"Estado de la organización":"Sin proyectos autorizados");head.firstChild.prepend(title);content.append(head);
      content.append(el("aside","Modo local de solo lectura. Ejecución de modelos y efectos externos deshabilitados. La revisión almacenada no equivale a dictamen independiente.","banner"));
      if(!detail){content.append(empty("La API no ha devuelto proyectos accesibles para esta identidad."));return}
      const metrics=el("section",undefined,"grid");
      for(const [label,value] of [["Proyecto",detail.name],["Mandato",detail.mandate.title],["Tareas",String(board.length)]]){const card=el("div",undefined,"metric");card.append(el("span",label,"muted"),el("strong",value));metrics.append(card)}
      content.append(metrics);
      const mandate=panel("Mandato confirmado");mandate.append(el("p",detail.mandate.objective));mandate.append(el("span","Mandato · "+detail.mandate.status,"state"),el("span","  Proyecto · "+detail.state,"state"));content.append(mandate);
      content.append(renderBoard());
    }
    function renderBoard(){
      const section=panel("Trabajo del proyecto");
      if(board.length===0){section.append(empty("No hay tareas registradas en este proyecto."));return section}
      const lanes=el("div",undefined,"board");
      for(const state of states){const lane=el("section",undefined,"lane");lane.append(el("h3",labels[state]));const tasks=board.filter(task=>task.status===state);
        if(tasks.length===0)lane.append(el("p","Sin tareas","muted"));
        for(const task of tasks){const card=el("article",undefined,"task-card"),button=el("button",task.title,"task-title");button.type="button";button.addEventListener("click",()=>{selectedTask=task.id;activePage="project";syncNav();render()});card.append(button,el("p",task.id,"meta"),el("span",(task.acceptance_criteria||[]).length+" criterios · "+task.status,"meta"));lane.append(card)}lanes.append(lane)}
      section.append(lanes);return section;
    }
    function renderProject(){
      if(!detail){content.append(empty("Selecciona un proyecto accesible para ver sus datos."));return}
      const head=el("div",undefined,"page-head");const heading=el("div");heading.append(el("span","Proyecto","eyebrow"),el("h2",detail.name),el("p","Identidad organizativa: proyecto · estado "+detail.state));head.append(heading);content.append(head);
      const mandate=panel("Mandato asociado");mandate.append(el("h3",detail.mandate.title),el("p",detail.mandate.objective),el("span","ID de mandato: "+detail.mandate.id,"meta"),el("p","Confirmación: "+detail.mandate.status+" · autoridad registrada: "+(detail.mandate.confirmed_by||"no disponible"),"meta"));content.append(mandate);
      content.append(renderBoard());
      if(selectedTask){const task=board.find(w=>w.id===selectedTask);if(task)loadTaskDetail(task).catch(err=>setMessage("No se pudo leer el detalle de tarea: "+err.message,true))}
    }
    async function loadTaskDetail(task){
      if(document.querySelector("#task-detail[data-id='"+CSS.escape(task.id)+"']"))return;
      const data=await request("/v1/projects/"+encodeURIComponent(selectedProject)+"/work/"+encodeURIComponent(task.id));
      if(selectedTask!==data.id)return;
      const box=panel("Detalle de tarea · "+data.title);box.id="task-detail";box.dataset.id=data.id;
      box.append(el("p","Autor (identidad de agente): "+data.author_id,"meta"));
      const runs=el("div");runs.append(el("h3","Ejecuciones (procesos técnicos)"));
      if(!data.executions.length)runs.append(empty("No hay ejecuciones registradas para esta tarea."));
      for(const run of data.executions){const row=el("article",undefined,"task-card");row.append(el("strong","Ejecución "+run.id,"refs"),el("p","Estado: "+run.status+" · intentos: "+run.attempts),el("p","Worker (identidad): "+(run.worker_id||"no asignado"),"meta"));runs.append(row)}box.append(runs);
      const reviews=el("div");reviews.append(el("h3","Revisiones registradas"));
      if(!data.reviews.length)reviews.append(empty("No hay dictamen registrado. No se infiere aprobación."));
      for(const review of data.reviews){const row=el("article",undefined,"task-card");row.append(el("strong",review.decision+" · " + review.id),el("p","Auditor (identidad): "+review.reviewer_id+" · "+displayDate(review.created_at)),el("p","Registro almacenado; independencia y validez no certificadas.","meta"));reviews.append(row)}box.append(reviews);
      box.append(el("p","Los resultados de pruebas y metadatos de PR no están expuestos por la API actual; esta vista no los simula.","banner"));content.append(box);
    }
    function renderActivity(){
      content.append(el("span","Perspectiva técnica","eyebrow"),el("h2","Actividad auditada"),el("p","Eventos persistidos del proyecto y sus tareas. Lista limitada a los 100 más recientes.","muted"));
      if(!activity.length){content.append(empty("No hay eventos registrados para este proyecto."));return}
      const list=el("ol",undefined,"list");for(const event of activity){const item=el("li"),row=el("div",undefined,"row");row.append(el("strong",event.kind),el("time",displayDate(event.created_at),"meta"));item.append(row,el("p","Sujeto: "+event.subject_id,"refs"));list.append(item)}content.append(list);
    }
    function renderEvidence(){
      content.append(el("span","Pruebas, auditoría y procedencia","eyebrow"),el("h2","Evidencias"),el("p","Referencias tal como están almacenadas. Una referencia no es validación ni dictamen.","muted"));
      const rows=board.flatMap(task=>(task.evidence||[]).map(ref=>({task,ref})));
      if(!rows.length){content.append(empty("No existen referencias de evidencia en las tareas de este proyecto."));}
      else{const list=el("ul",undefined,"list");for(const {task,ref} of rows){const item=el("li");item.append(el("strong",task.title),el("p",String(ref),"refs"),el("p","Estado de integridad: no verificado por esta vista","meta"));list.append(item)}content.append(list)}
      content.append(el("aside","La API actual no expone resultados de CI ni un dictamen auditor verificable por SHA. No se presentan como disponibles.","banner"));
    }
    function renderDecisions(){
      content.append(el("span","Autoridad reservada","eyebrow"),el("h2","Decisiones reservadas"));
      const box=el("section",undefined,"panel decision");box.append(el("h3","Canal informativo · solo lectura"),el("p","Las confirmaciones estratégicas, los cambios constitucionales y la aceptación de riesgos permanecen reservados a la autoridad CEO. Esta interfaz no crea, confirma ni simula decisiones."));
      if(detail)box.append(el("p","Mandato visible: "+detail.mandate.title+" · estado registrado: "+detail.mandate.status,"meta"));
      box.append(el("p","No hay endpoint de lectura para una bandeja de decisiones pendiente; no se inventa una lista.","meta"));content.append(box);
    }
    function syncNav(){for(const button of document.querySelectorAll(".nav button")){if(button.dataset.page===activePage)button.setAttribute("aria-current","page");else button.removeAttribute("aria-current")}}
    function render(){content.replaceChildren();if(!projects.length){renderHome();return}if(activePage==="home")renderHome();else if(activePage==="project")renderProject();else if(activePage==="activity")renderActivity();else if(activePage==="evidence")renderEvidence();else renderDecisions();syncNav()}
    projectSelect.addEventListener("change",()=>{selectedProject=projectSelect.value;selectedTask=null;loadProjectData()});
    document.querySelector("#reload").addEventListener("click",()=>loadProjects().catch(err=>setMessage("No se pudo actualizar: "+err.message,true)));
    document.querySelectorAll(".nav button").forEach(button=>button.addEventListener("click",()=>{activePage=button.dataset.page;selectedTask=null;render()}));
    loadProjects().catch(err=>{projectSelect.replaceChildren();setMessage("No se puede consultar el núcleo: "+err.message,true);content.replaceChildren(el("div","La interfaz no usa datos simulados. Comprueba la API y los permisos antes de reintentar.","empty"))});
  </script>
</body>
</html>
